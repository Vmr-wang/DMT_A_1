[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmt-mood-pipeline"
version = "0.1.0"
description = "Core modeling pipeline for the VU DMT advanced mood prediction assignment."
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "torch>=2.3",
  "matplotlib>=3.9",
]

[project.scripts]
dmt-mood-pipeline = "dmt_mood_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
